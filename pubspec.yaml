name: spotter_app
description: Connect with verified fitness trainers on-demand
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.5.0
  
  # State Management
  provider: ^6.1.1
  
  # UI/UX
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # Maps & Location
  google_maps_flutter: ^2.10.0
  geolocator: ^13.0.1
  geocoding: ^2.1.1
  
  # Payments (Razorpay - will add later)
  # razorpay_flutter: ^1.3.6
  
  # Notifications
  # firebase_messaging: ^14.7.9
  
  # Utils
  intl: ^0.19.0
  image_picker: ^1.0.5
  permission_handler: ^11.0.1
  url_launcher: ^6.2.1
  share_plus: ^10.1.4
  flutter_dotenv: ^5.1.0
  http: ^1.2.0
  shared_preferences: ^2.2.0
  
  # Icons
  cupertino_icons: ^1.0.2
  table_calendar: ^3.1.3
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env